<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTS Puzzle — DEER Puzzle 3</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* ── Puzzle 1 design language ── */
  --bg:#060d1a; --surface:#0b1629; --panel:#0f1e35; --border:#1a3050;
  --accent:#00d4ff; --accent2:#ff6b35; --success:#00ff88; --danger:#ff4757;
  --text:#c8ddf0; --dim:#4a6580;
  --font-mono:'Share Tech Mono',monospace;
  --font-head:'Orbitron',sans-serif;
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);

  /* ── PARTS colours — preserved exactly ── */
  --purple-bg:#1a1535;--purple-border:#534AB7;--purple-accent:#a89cf5;--purple-text:#c4baff;
  --green-bg:#0d1f10;--green-border:#4A8C1C;--green-accent:#7ecb4a;--green-text:#a8e07a;
  --pink-bg:#1f0d14;--pink-border:#C0395A;--pink-accent:#f07090;--pink-text:#f5aabf;
  --orange-bg:#1f1505;--orange-border:#C07A10;--orange-accent:#f0a840;--orange-text:#f5c878;
  --blue-bg:#071828;--blue-border:#2B6CB0;--blue-accent:#4da8e0;--blue-text:#90ccf5;

  /* ── Status colours ── */
  --ok:#00ff88; --oklt:#062018; --okbd:#00a855;
  --err:#ff4757; --errlt:#200608; --errbd:#a82030;
  --p1:#00d4ff; --p1lt:#061520; --p1bd:#0090b0;
  --p2:#ff6b35; --p2lt:#1f0d05; --p2bd:#b04020;
}

/* Scanline overlay — matches puzzle 1 */
body::before{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,212,255,0.015) 0px,rgba(0,212,255,0.015) 1px,transparent 1px,transparent 3px);
  pointer-events:none;z-index:9999;}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font-mono);font-size:14px;line-height:1.5;}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── Header ── */
.app-header{background:linear-gradient(90deg,#060d1a 0%,#091422 50%,#060d1a 100%);
  padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0;
  border-bottom:1px solid var(--accent);box-shadow:0 0 20px rgba(0,212,255,.15);}
.logo{font-family:var(--font-head);font-size:13px;font-weight:900;color:var(--accent);
  letter-spacing:3px;text-shadow:0 0 12px var(--accent);}
.logo span{font-family:var(--font-mono);color:var(--dim);font-size:10px;font-weight:400;
  margin-left:8px;letter-spacing:1px;}
.sig{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;
  color:var(--dim);letter-spacing:1px;}
.sig-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .3s;}
.sig-dot.connected{background:var(--success);box-shadow:0 0 6px var(--success);}
.sig-dot.connecting{background:#ffcc00;animation:pulse 1s infinite;}
.sig-dot.error{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Tabs ── */
.view-tabs{display:flex;background:#0d1f38;border-bottom:1px solid var(--border);
  border-top:2px solid var(--accent);flex-shrink:0;z-index:10;}
.tab-btn{flex:1;padding:11px 10px;background:transparent;border:none;
  border-bottom:3px solid transparent;color:var(--dim);
  font-family:var(--font-head);font-size:11px;letter-spacing:2px;
  cursor:pointer;transition:all .2s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.tab-1{color:var(--accent);border-bottom-color:var(--accent);
  background:rgba(0,212,255,.08);text-shadow:0 0 8px rgba(0,212,255,.5);}
.tab-btn.tab-2{color:var(--accent2);border-bottom-color:var(--accent2);
  background:rgba(255,107,53,.08);text-shadow:0 0 8px rgba(255,107,53,.5);}

/* ── Player panels ── */
.view-panel{display:none;flex:1;overflow-y:auto;
  height:calc(100vh - 96px);padding:1.25rem 1.5rem 2rem;}
.view-panel::-webkit-scrollbar{width:4px;}
.view-panel::-webkit-scrollbar-track{background:transparent;}
.view-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.view-panel.active{display:block;}

/* ── Section spacing ── */
.section{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.1rem;}

/* ── Section label ── */
.section-label{font-family:var(--font-head);font-size:10px;letter-spacing:3px;
  text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── Control center title ── */
.control-center-title{font-family:var(--font-head);font-size:13px;font-weight:700;
  letter-spacing:4px;text-transform:uppercase;color:var(--accent);
  text-shadow:0 0 12px rgba(0,212,255,.4);
  background:var(--panel);border:1px solid var(--accent);
  border-radius:var(--radius-md);padding:.7rem 1rem;text-align:center;
  box-shadow:0 0 16px rgba(0,212,255,.1);}

/* ── Mission brief (outsider friend note) ── */
.friend-message{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.3);
  border-left:3px solid #f59e0b;border-radius:var(--radius-md);
  padding:.85rem 1rem .75rem 1rem;
  box-shadow:0 2px 12px rgba(245,158,11,.08);position:relative;}
.friend-message::before{content:'MISSION BRIEF';font-family:var(--font-head);font-size:8px;
  font-weight:700;letter-spacing:.2em;color:#f59e0b;opacity:.7;display:block;margin-bottom:.5rem;}
.friend-message-text{font-size:14px;color:#f0d080;line-height:1.65;font-family:var(--font-mono);}
.friend-message-text strong{color:#fbbf24;}
.friend-message-sender{font-size:11px;color:#a07030;margin-top:.5rem;font-style:italic;text-align:right;}

/* ── Prompt panel ── */
.prompt-panel{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
.prompt-header{display:flex;align-items:center;gap:.4rem;padding:.5rem .9rem;
  background:var(--bg);border-bottom:1px solid var(--border);}
.prompt-dot{width:9px;height:9px;border-radius:50%;background:var(--border);}
.prompt-title{font-family:var(--font-head);font-size:9px;font-weight:700;color:var(--dim);
  letter-spacing:.12em;text-transform:uppercase;margin-left:.2rem;}
.prompt-body{padding:.9rem 1.1rem;}
.prompt-bubble{font-size:13px;color:var(--text);line-height:2.2;
  background:var(--bg);border-radius:var(--radius-sm);padding:.75rem 1rem;
  border:1px solid var(--border);}
/* Blank slots in prompt */
.blank{display:inline-block;min-width:80px;padding:.1rem .4rem;border-radius:3px;
  border:1.5px dashed var(--border);background:var(--surface);color:var(--dim);
  font-weight:600;text-align:center;transition:all .3s;}
.blank.filled-persona {background:var(--purple-bg);border-color:var(--purple-border);
  color:var(--purple-text);border-style:solid;}
.blank.filled-recipient{background:var(--pink-bg);border-color:var(--pink-border);
  color:var(--pink-text);border-style:solid;}
.blank.filled-tone{background:var(--orange-bg);border-color:var(--orange-border);
  color:var(--orange-text);border-style:solid;}
/* Locked aim/structure highlights in prompt */
.hl-blue{background:var(--blue-bg);color:var(--blue-text);border-radius:3px;padding:1px 5px;
  border:1px solid var(--blue-border);}
.hl-green{background:var(--green-bg);color:var(--green-text);border-radius:3px;padding:1px 5px;
  border:1px solid var(--green-border);}

/* ── PARTS lock row (P2 phase 1) ── */
.parts-lock-row{display:flex;flex-direction:column;align-items:center;gap:1rem;
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:1.5rem 1.75rem;
  box-shadow:0 0 20px rgba(0,212,255,.06);max-width:580px;margin:0 auto;}
.parts-header{display:flex;align-items:center;gap:.6rem;}
.parts-header .lock-emoji{font-size:1.6rem;transition:transform .3s;}
.parts-header .lock-emoji.open{transform:rotate(-15deg);}
.parts-header .lock-label{font-family:var(--font-head);font-size:12px;font-weight:700;
  letter-spacing:.15em;color:var(--dim);text-transform:uppercase;}
.parts-header .lock-label.green{color:var(--success);}
.parts-tiles-row{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;}
.lock-wrap{display:flex;flex-direction:column;align-items:center;gap:.25rem;flex-shrink:0;}
.parts-letters{display:flex;gap:.5rem;}

/* ── PARTS tiles ── */
.parts-display{display:flex;align-items:center;gap:.5rem;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius-md);padding:.75rem 1rem;}
.parts-label{font-family:var(--font-head);font-size:9px;font-weight:700;color:var(--dim);
  letter-spacing:.1em;text-transform:uppercase;margin-right:.25rem;}
.parts-tiles{display:flex;gap:.4rem;flex-wrap:wrap;}
.parts-tile{width:5rem;min-height:5.5rem;border-radius:var(--radius-md);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.3rem;padding:.5rem .4rem;
  border:1.5px solid transparent;position:relative;user-select:none;cursor:default;
  transition:box-shadow .2s;}
.parts-tile:hover{box-shadow:0 0 10px rgba(0,212,255,.15);}
.tile-letter{font-family:var(--font-head);font-size:1.7rem;font-weight:900;line-height:1;}
.tile-word{font-family:var(--font-head);font-size:7px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;line-height:1;opacity:.8;}
.tile-lock-icon{font-size:1rem;line-height:1;padding:.15rem;
  background:transparent;border:none;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform .15s,opacity .15s,background .15s,box-shadow .15s;cursor:pointer;}
.tile-lock-icon.locked{opacity:.7;}
.tile-lock-icon.locked:hover,
.tile-lock-icon.locked:focus{transform:scale(1.2);opacity:1;
  background:rgba(0,212,255,.1);box-shadow:0 0 0 3px rgba(0,212,255,.2);outline:none;}
.tile-lock-icon.unlocked{opacity:.9;}
.tile-lock-icon.unlocked:hover,
.tile-lock-icon.unlocked:focus{transform:scale(1.2);opacity:1;
  background:rgba(0,212,255,.1);box-shadow:0 0 0 3px rgba(0,212,255,.2);outline:none;}

/* ── Option panels ── */
.panel{border-radius:var(--radius-md);padding:.75rem .85rem;
  display:flex;flex-direction:column;gap:.45rem;border:1px solid transparent;}
.panel-purple{background:var(--purple-bg);border-color:var(--purple-border);}
.panel-green {background:var(--green-bg); border-color:var(--green-border);}
.panel-pink  {background:var(--pink-bg);  border-color:var(--pink-border);}
.panel-orange{background:var(--orange-bg);border-color:var(--orange-border);}
.panel-blue  {background:var(--blue-bg);  border-color:var(--blue-border);grid-column:1/-1;}
.panel-label{font-family:var(--font-head);font-size:9px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;text-align:center;
  min-height:13px;opacity:0;transition:opacity .4s;}
.panel-label.visible{opacity:1;}
.panel-purple .panel-label{color:var(--purple-accent);}
.panel-green  .panel-label{color:var(--green-accent);}
.panel-pink   .panel-label{color:var(--pink-accent);}
.panel-orange .panel-label{color:var(--orange-accent);}
.panel-blue   .panel-label{color:var(--blue-accent);}
.panel-locked-note{font-size:10px;text-align:center;color:var(--dim);margin-top:-.1rem;
  letter-spacing:.04em;}
.panel-locked-note.completed{color:var(--success);font-weight:600;
  text-shadow:0 0 6px rgba(0,255,136,.3);}
.parts-desc{font-family:var(--font-mono);font-size:10px;color:var(--dim);text-align:center;
  line-height:1.4;margin-top:-.2rem;margin-bottom:.1rem;font-style:italic;}

/* ── Opts grid ── */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;}
.opts.four-col{grid-template-columns:repeat(4,1fr);}
.opt{display:flex;flex-direction:column;align-items:center;gap:.2rem;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:.5rem .4rem;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;
  color:var(--text);text-align:center;font-family:var(--font-mono);}
.opt:hover:not(:disabled){border-color:var(--accent);
  background:rgba(0,212,255,.06);box-shadow:0 0 8px rgba(0,212,255,.15);}
.opt.active{border-color:var(--accent);background:rgba(0,212,255,.12);
  color:var(--accent);box-shadow:0 0 10px rgba(0,212,255,.2);}
.opt.p2-sel{border-color:var(--blue-accent);background:var(--blue-bg);color:var(--blue-text);}
.opt.correct{border-color:var(--success);background:var(--oklt);color:var(--success);
  cursor:default;pointer-events:none;box-shadow:0 0 8px rgba(0,255,136,.2);}
.opt.wrong{border-color:var(--err);background:var(--errlt);color:var(--err);}
.opt:disabled{opacity:.35;cursor:not-allowed;}
.opt.locked-on{border-color:var(--green-border);background:var(--green-bg);
  color:var(--green-text);cursor:default;pointer-events:none;opacity:1;}
.opt.locked-off{opacity:.2;cursor:default;pointer-events:none;}
.opt-label{font-size:12px;letter-spacing:.02em;}

/* ── Panels grid ── */
.panels-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.panels-grid.parts-row{grid-template-columns:repeat(5,1fr);}
.panels-grid.parts-row .panel-blue{grid-column:auto;}
.panels-grid.parts-row .opts,
.panels-grid.parts-row .opts.four-col{grid-template-columns:1fr;}

/* ── Generate / Submit buttons ── */
.gen-btn,.submit-btn{width:100%;padding:.7rem;border-radius:var(--radius-md);
  font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:2px;
  cursor:pointer;border:1px solid;transition:all .2s;}
.gen-btn{background:rgba(0,212,255,.1);border-color:var(--accent);color:var(--accent);}
.gen-btn:hover:not(:disabled){background:rgba(0,212,255,.22);
  box-shadow:0 0 18px rgba(0,212,255,.3);}
.gen-btn:disabled{opacity:.35;cursor:not-allowed;}
.submit-btn{background:rgba(0,212,255,.1);border-color:var(--accent);color:var(--accent);}
.submit-btn:hover:not(:disabled){background:rgba(0,212,255,.22);
  box-shadow:0 0 18px rgba(0,212,255,.3);}
.submit-btn:disabled{opacity:.35;cursor:not-allowed;}
.submit-row{display:flex;align-items:center;gap:.75rem;}
.attempts-counter{font-size:12px;color:var(--dim);flex-shrink:0;letter-spacing:.03em;}

/* ── Attempts banner ── */
.attempts-banner{background:var(--panel);color:var(--dim);font-size:12px;
  border-radius:var(--radius-md);padding:.55rem 1rem;text-align:center;
  border:1px solid var(--border);letter-spacing:.05em;font-family:var(--font-head);}
.attempts-banner strong{color:var(--accent);font-size:14px;
  text-shadow:0 0 8px rgba(0,212,255,.4);}

/* ── Terminal output ── */
.terminal-output{border-radius:var(--radius-md);overflow:hidden;
  box-shadow:var(--shadow-md);border:1px solid var(--border);}
.terminal-titlebar{display:flex;align-items:center;gap:.4rem;
  background:#040b16;padding:.5rem .75rem;border-bottom:1px solid var(--border);}
.terminal-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.terminal-dot.red{background:#ff5f57;}
.terminal-dot.yellow{background:#febc2e;}
.terminal-dot.green{background:#28c840;}
.terminal-label{font-family:var(--font-head);font-size:10px;font-weight:700;color:var(--dim);
  margin-left:.4rem;letter-spacing:.12em;text-transform:uppercase;}
.terminal-body{background:#020810;padding:1rem 1.1rem;
  min-height:120px;font-family:var(--font-mono);font-size:13px;
  display:flex;flex-direction:column;gap:.9rem;
  border-top:1px solid rgba(0,212,255,.08);}
.terminal-entry{display:flex;flex-direction:column;gap:.3rem;}
.terminal-meta{color:var(--success);font-size:11px;font-weight:600;letter-spacing:.05em;}
.terminal-text{color:var(--text);line-height:1.7;}
.terminal-idle{color:var(--dim);font-style:italic;}
.terminal-hint{margin-top:.4rem;padding:.4rem .6rem;background:#0d0a00;
  border-left:3px solid #f59e0b;border-radius:0 3px 3px 0;
  color:#fcd34d;font-size:12px;line-height:1.55;}
.terminal-cursor{display:inline-block;animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── Response cards ── */
.response-stack{display:flex;flex-direction:column;gap:.5rem;}
.response-card{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:.8rem 1rem;box-shadow:var(--shadow-sm);}
.response-meta{font-family:var(--font-head);font-size:9px;font-weight:700;color:var(--dim);
  margin-bottom:.4rem;letter-spacing:.1em;text-transform:uppercase;}
.response-text{font-size:13px;color:var(--text);line-height:1.65;}
.followup-note{margin-top:.5rem;padding:.4rem .6rem;background:#0d0a00;
  border-left:3px solid #f59e0b;border-radius:0 3px 3px 0;font-size:12px;color:#fcd34d;}

/* ── Attempt chips ── */
.attempt-card{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:.7rem 1rem;box-shadow:var(--shadow-sm);}
.attempt-meta{font-family:var(--font-head);font-size:9px;font-weight:700;color:var(--dim);
  margin-bottom:.4rem;letter-spacing:.1em;text-transform:uppercase;}
.attempt-chips{display:flex;flex-wrap:wrap;gap:.3rem;}
.chip{font-size:10px;font-weight:600;padding:.2rem .5rem;border-radius:3px;
  font-family:var(--font-mono);letter-spacing:.03em;}
.chip-ok{background:var(--oklt);color:var(--success);border:1px solid var(--okbd);}
.chip-bad{background:var(--errlt);color:var(--err);border:1px solid var(--errbd);}

/* ── Locked options ── */
.locked-note{font-size:10px;text-align:center;color:var(--dim);}

/* ── Output card ── */
.output-card{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:1rem 1.2rem;box-shadow:var(--shadow-sm);}
.output-card-label{font-family:var(--font-head);font-size:9px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:.6rem;}
.output-bullets{list-style:none;display:flex;flex-direction:column;gap:.45rem;}
.output-bullets li{font-size:13px;color:var(--text);line-height:1.6;
  padding-left:1.2rem;position:relative;}
.output-bullets li::before{content:'•';position:absolute;left:0;color:var(--accent);}

/* ── Toggle bar ── */
.toggle-bar{display:flex;gap:.4rem;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:.35rem;width:fit-content;margin-bottom:1rem;}
.tog-btn{padding:.35rem 1rem;border-radius:var(--radius-md);font-size:12px;font-weight:500;
  cursor:pointer;border:none;background:transparent;color:var(--dim);transition:all .15s;
  font-family:var(--font-mono);}
.tog-btn.active{background:var(--panel);color:var(--accent);border:1px solid var(--accent);}

/* ── Phase banner ── */
.phase-banner{background:var(--panel);border-radius:var(--radius-md);padding:1rem 1.25rem;
  color:var(--text);font-family:var(--font-mono);font-size:13px;line-height:1.7;
  margin-bottom:1rem;border:1px solid var(--border);}
.phase-banner-title{color:var(--success);font-family:var(--font-head);font-size:12px;
  font-weight:700;margin-bottom:.4rem;letter-spacing:.1em;text-transform:uppercase;
  text-shadow:0 0 8px rgba(0,255,136,.4);}

/* ── Lock display ── */
.lock-display{display:flex;align-items:center;gap:.6rem;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius-md);padding:.6rem 1rem;
  box-shadow:var(--shadow-sm);font-size:13px;}
.lock-emoji{font-size:1.4rem;transition:all .4s;}
.lock-label{font-weight:600;color:var(--dim);}
.lock-label.green{color:var(--success);}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--panel);border:1px solid var(--accent);border-radius:var(--radius-lg);
  padding:1.5rem;max-width:460px;width:100%;
  box-shadow:0 0 40px rgba(0,212,255,.2);}
.modal-title{font-family:var(--font-head);font-size:14px;font-weight:700;letter-spacing:3px;
  margin-bottom:.75rem;color:var(--accent);text-transform:uppercase;
  text-shadow:0 0 10px rgba(0,212,255,.4);}
.modal-title.success{color:var(--success);text-shadow:0 0 10px rgba(0,255,136,.4);}
.modal-body{font-size:13px;color:var(--text);line-height:1.7;
  white-space:pre-line;margin-bottom:1.25rem;font-family:var(--font-mono);}
.modal-close-btn{width:100%;padding:.6rem;border-radius:var(--radius-md);
  border:1px solid var(--accent);background:rgba(0,212,255,.08);
  font-size:12px;font-weight:700;cursor:pointer;color:var(--accent);
  font-family:var(--font-head);letter-spacing:2px;transition:all .2s;}
.modal-close-btn:hover{background:rgba(0,212,255,.2);box-shadow:0 0 12px rgba(0,212,255,.3);}

/* ── Inbox FAB + popover ── */
.inbox-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:500;
  display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;}
.inbox-fab{width:3.2rem;height:3.2rem;border-radius:50%;
  border:1px solid var(--accent);cursor:pointer;
  background:rgba(0,212,255,.12);box-shadow:0 0 14px rgba(0,212,255,.25);
  display:flex;align-items:center;justify-content:center;position:relative;
  transition:transform .15s,box-shadow .15s;flex-shrink:0;}
.inbox-fab:hover{transform:scale(1.1);box-shadow:0 0 22px rgba(0,212,255,.4);}
.inbox-fab-icon{font-size:1.3rem;line-height:1;}
.inbox-ping{position:absolute;top:2px;right:2px;width:11px;height:11px;
  border-radius:50%;background:var(--danger);border:2px solid var(--bg);
  animation:ping-pulse 1.4s ease-in-out infinite;}
@keyframes ping-pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:.7;}}
.inbox-popover{display:none;width:310px;background:var(--panel);color:var(--text);
  border-radius:var(--radius-lg);box-shadow:0 8px 32px rgba(0,0,0,.6);
  overflow:visible;border:1px solid var(--accent);position:relative;}
.inbox-popover.open{display:flex;flex-direction:column;}
.inbox-popover-header{display:flex;align-items:center;justify-content:space-between;
  padding:.6rem .85rem;background:var(--bg);border-bottom:1px solid var(--border);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.inbox-popover-title{font-family:var(--font-head);font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
.inbox-popover-close{background:transparent;border:none;color:var(--dim);
  font-size:16px;cursor:pointer;line-height:1;padding:0;transition:color .12s;}
.inbox-popover-close:hover{color:var(--text);}
.inbox-popover-body{padding:.85rem;font-size:13px;line-height:1.75;
  white-space:pre-line;max-height:320px;overflow-y:auto;
  color:var(--text);font-family:var(--font-mono);}
.inbox-popover-body::-webkit-scrollbar{width:3px;}
.inbox-popover-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.inbox-sender{margin-top:.75rem;font-size:11px;color:var(--dim);font-style:italic;}
.inbox-popover::after{content:'';position:absolute;bottom:-8px;right:1rem;
  width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:8px solid var(--accent);}

/* ── Costume display ── */
.costume-display{display:flex;align-items:center;justify-content:center;gap:1.5rem;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:1rem;box-shadow:var(--shadow-sm);}
.costume-slot{display:flex;flex-direction:column;align-items:center;gap:.35rem;}
.costume-emoji{font-size:2.5rem;min-height:3rem;display:flex;align-items:center;}
.costume-label{font-family:var(--font-head);font-size:8px;text-transform:uppercase;
  letter-spacing:.1em;font-weight:700;color:var(--dim);}
.costume-blank{font-size:12px;font-weight:600;color:var(--dim);
  background:var(--bg);border:1px dashed var(--border);border-radius:var(--radius-sm);
  padding:.2rem .6rem;min-width:80px;text-align:center;transition:all .3s;}
</style>

// ══════════════════════════════════════════════════════════
// WIN CONDITIONS & HINTS
// ══════════════════════════════════════════════════════════
const OW = { persona:"Shakespearean Playwright", recipient:"Musician", tones:["Angry Tone","Sad Tone"] };
const AW = { persona:"Surfer Dude", recipient:"Chef", tone:"Serious Tone" };

const HINTS_O = [
  "Hmm I want something that WOWS my teacher. Hmmm I did see her read Romeo and Juliet the other day…",
  "This doesn't feel creative enough. I need to make this more personalized to me. My favorite hobby is playing music…",
  "Something's not quite right… the assignment is missing that emotional aspect to it."
];
const HINTS_A = [
  "You know, my teacher always says to go with the flow and keep it chill… kind of like someone who rides waves for a living.",
  "And she loves it when stories have a real-world angle — like something you'd find in a kitchen or at a dinner table.",
  "She also mentioned the best stories have a certain gravity to them… nothing too playful, nothing too emotional. Just focused and composed."
];

const P2_CORRECT = {
  persona:"Teacher", aim:"Science report", recipient:"Kid", tone:"Friendly", structure:"Bullet points"
};

// PARTS letter explanations — shown via tooltip (P,R,T) or info-icon modal (A,S)
const PARTS_INFO = {
  P:{name:'Persona',   desc:'The voice or character the AI adopts — who it is roleplaying as when it writes.'},
  A:{name:'Aim',       desc:'The goal of the prompt — what kind of output you want the AI to produce (a story, a report, a pitch, etc.).'},
  R:{name:'Recipient', desc:'The intended audience — who the output is written for.'},
  T:{name:'Tone',      desc:'The emotional quality of the writing — friendly, angry, sad, or serious.'},
  S:{name:'Structure', desc:'How the output is formatted or organised — its shape on the page.'}
};
function showPartsInfo(letter){
  const info = PARTS_INFO[letter];
  if (info) showModal(info.name, info.desc, false, null);
}

function toggleInbox(player) {
  const popover = document.getElementById(`${player}-inbox-popover`);
  if (!popover) return;
  const isOpen = popover.classList.toggle('open');
  // Mark as read on first open — remove ping
  if (isOpen) {
    if (player === 'p1') S.p1InboxRead = true;
    if (player === 'p2') S.p2InboxRead = true;
    // Remove ping badge from FAB without full re-render
    const wrap = document.getElementById(`${player}-inbox-wrap`);
    if (wrap) { const ping = wrap.querySelector('.inbox-ping'); if (ping) ping.remove(); }
  }
}

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const LOCAL_KEYS = new Set(['showModal','modalData','lastGenerated','p1InboxRead','p2InboxRead']);

function freshState() {
  return {
    phase: 1,  // 1 = phase 1 active, 2 = phase 2 active
    p1: { persona:null, recipient:null, tone:null },
    g: {
      count:0, winShown:false, earlyGuessed:false,
      hint1:false, hint2:false, hint3:false,
      pOk:false, rOk:false, tOk:false
    },
    p1History: [],  // [{meta, story, hint}] — synced to P2
    p2sel: { persona:null, aim:null, recipient:null, tone:null, structure:null },
    p2left: 3,
    p2done: false,
    p2Attempts: [],  // [{snapshot, results}] — for rendering attempt history
    // local-only
    showModal: false,
    modalData: null,
    lastGenerated: null,
    p1InboxRead: false,
    p2InboxRead: false,
  };
}

let S = freshState();

function syncableState() {
  const out = {};
  for (const k of Object.keys(S)) {
    if (!LOCAL_KEYS.has(k)) out[k] = S[k];
  }
  return out;
}

function applyRemoteState(remote) {
  const wasWinShown = S.g.winShown;
  const wasPhase2 = S.phase === 2;
  const wasWon = S.p2done && S.p2Attempts[0]?.results &&
    Object.values(S.p2Attempts[0].results).every(Boolean);

  for (const k of Object.keys(remote)) {
    if (!LOCAL_KEYS.has(k)) S[k] = remote[k];
  }

  const isWinShownNow = S.g.winShown;
  const isPhase2Now = S.phase === 2;
  const isWon = S.p2done && S.p2Attempts[0]?.results &&
    Object.values(S.p2Attempts[0].results).every(Boolean);

  // Phase 1 win: g.winShown just became true — show Lock 1 modal on this screen
  // (P1 shows it directly in generateStory; P2 detects it here)
  if (!wasWinShown && isWinShownNow && !isPhase2Now && !S.showModal) {
    showModal('🔓 Lock 1 Disabled!', 'The lockdown has been successfully disabled.', true, goToPhase2);
  }
  // Phase 2 win: show the exit modal if not already shown
  else if (!wasWon && isWon && !S.showModal) {
    showModal('🚪 You\'re out!', 'Lock 2 cracked. You correctly reverse-engineered all five PARTS components. The exit is open!', true, () => {
      window.parent.postMessage('puzzle3-complete', '*');
    });
  }

  renderAll();
}

// ══════════════════════════════════════════════════════════
// GAME LOGIC (pure — no DOM touches)
// ══════════════════════════════════════════════════════════
function winPersona()   { return S.g.earlyGuessed ? AW.persona    : OW.persona; }
function winRecipient() { return S.g.earlyGuessed ? AW.recipient  : OW.recipient; }
function winTones()     { return S.g.earlyGuessed ? [AW.tone]     : OW.tones; }

function isOriginalWin() {
  return S.p1.persona === OW.persona && S.p1.recipient === OW.recipient && OW.tones.includes(S.p1.tone);
}
function isAltWin() {
  return S.p1.persona === AW.persona && S.p1.recipient === AW.recipient && S.p1.tone === AW.tone;
}

function tryChecks() {
  if (!S.g.pOk && S.g.hint1 && S.p1.persona === winPersona())       S.g.pOk = true;
  if (!S.g.rOk && S.g.hint2 && S.p1.recipient === winRecipient())   S.g.rOk = true;
  if (!S.g.tOk && S.g.hint3 && winTones().includes(S.p1.tone))      S.g.tOk = true;
}

// ══════════════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════════════
function setP1Option(group, val) {
  S.p1[group] = val;
  tryChecks();
  syncAndRender();
}

function generateStory() {
  if (!S.p1.persona || !S.p1.recipient || !S.p1.tone || S.g.winShown) return;
  S.g.count++;

  const story = STORIES[S.p1.persona]?.[S.p1.recipient]?.[S.p1.tone] || 'Story not found.';
  const hints = S.g.earlyGuessed ? HINTS_A : HINTS_O;
  let hint = null;

  if (!S.g.earlyGuessed && S.g.count <= 3 && isOriginalWin()) S.g.earlyGuessed = true;

  if (S.g.count === 4) { hint = hints[0]; S.g.hint1 = true; }
  else if (S.g.count === 5) { hint = hints[1]; S.g.hint2 = true; }
  else if (S.g.count === 6) { hint = hints[2]; S.g.hint3 = true; }

  tryChecks();

  const toneDisplay = S.p1.tone.replace(' Tone','');
  const meta = `Attempt ${S.g.count} — ${S.p1.persona} · ${S.p1.recipient} · ${toneDisplay}`;
  S.p1History.unshift({ meta, story, hint });  // prepend — newest first

  const win = (!S.g.earlyGuessed && isOriginalWin() && S.g.count > 3) ||
              (S.g.earlyGuessed && isAltWin() && S.g.count > 3);

  if (win) {
    S.g.winShown = true;
    S.lastGenerated = 'win';
  } else {
    S.lastGenerated = 'generated';
  }

  syncAndRender();

  // Show modal locally after render
  if (win) {
    showModal('🔓 Lock 1 Disabled!', 'The lockdown has been successfully disabled.', true, goToPhase2);
  } else {
    showModal('✓ Success', 'A response has been generated to your teammate.', false, null);
  }
}

function goToPhase2() {
  S.phase = 2;
  syncAndRender();
}

function setP2Option(cat, val) {
  if (S.p2done) return;
  S.p2sel[cat] = val;
  syncAndRender();
}

function submitP2() {
  if (S.p2done) return;
  // Only the P2 screen should be able to submit
  if (LOCKED_VIEW && LOCKED_VIEW !== 'p2') return;

  const cats = ['persona','aim','recipient','tone','structure'];
  if (cats.some(c => !S.p2sel[c])) {
    showModal('Incomplete', 'Please select one option in each category before submitting.', false, null);
    return;
  }

  S.p2left--;
  const attemptNum = 3 - S.p2left;
  const norm = v => (v||'').trim().toLowerCase();
  const results = {
    persona:   norm(S.p2sel.persona)   === norm(P2_CORRECT.persona),
    aim:       norm(S.p2sel.aim)       === norm(P2_CORRECT.aim),
    recipient: norm(S.p2sel.recipient) === norm(P2_CORRECT.recipient),
    tone:      norm(S.p2sel.tone)      === norm(P2_CORRECT.tone),
    structure: norm(S.p2sel.structure) === norm(P2_CORRECT.structure),
  };
  const allOk = Object.values(results).every(Boolean);

  S.p2Attempts.unshift({ snapshot: {...S.p2sel}, results, attemptNum });

  // Lock correct categories
  cats.forEach(cat => { if (!results[cat]) S.p2sel[cat] = null; });

  if (allOk) {
    S.p2done = true;
    syncAndRender();
    showModal('🚪 You\'re out!', 'Lock 2 cracked. You correctly reverse-engineered all five PARTS components. The exit is open!', true, () => {
      window.parent.postMessage('puzzle3-complete', '*');
    });
  } else if (S.p2left === 0) {
    S.p2done = true;
    syncAndRender();
    showModal('Lock holds.', 'Out of attempts. The correct PARTS settings have been revealed below.', false, null);
  } else {
    syncAndRender();
    showModal('Not quite.', 'Some settings are wrong — the correct ones are locked in. Keep reasoning about the others.', false, null);
  }
}

function resetGame() {
  S = freshState();
  renderModal();
  syncAndRender();
}

// ══════════════════════════════════════════════════════════
// MODAL (local-only — not synced)
// ══════════════════════════════════════════════════════════
let _modalCb = null;

function showModal(title, body, success, cb) {
  S.showModal = true;
  S.modalData = { title, body, success };
  _modalCb = cb || null;
  renderModal();
}

function closeModal() {
  S.showModal = false;
  S.modalData = null;
  const cb = _modalCb; _modalCb = null;
  renderModal();
  if (cb) cb();
}

function renderModal() {
  const root = document.getElementById('modal-root');
  if (!S.showModal || !S.modalData) { root.innerHTML = ''; return; }
  const { title, body, success } = S.modalData;
  const btnLabel = success && _modalCb ? 'Get out! →' : 'Close';
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-box">
        <div class="modal-title${success?' success':''}">${title}</div>
        <div class="modal-body">${body}</div>
        <button class="modal-close-btn" onclick="closeModal()">${btnLabel}</button>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════
// RENDER — PLAYER 1
// ══════════════════════════════════════════════════════════
function renderP1() {
  if (LOCKED_VIEW && LOCKED_VIEW !== 'p1') return;
  const el = document.getElementById('p1-content');
  let h = '';

  if (S.phase === 1) {
    // Friend message ABOVE title

function partsTile(letter, name, desc, unlocked, alwaysLocked) {
  const enabled = unlocked && !alwaysLocked;
  return `<div class="parts-tile${enabled?' tip-enabled':''}" role="listitem" tabindex="${enabled?'0':'-1'}"
    style="background:var(--${colorForLetter(letter)}-bg);color:var(--${colorForLetter(letter)}-text);border-color:var(--${colorForLetter(letter)}-border)">
    ${letter}
    <div class="tile-tooltip">
      <div class="tt-name">${name}</div>
      <div>${desc}</div>
    </div>
  </div>`;
}

function colorForLetter(l) {
  return {P:'purple',A:'green',R:'pink',T:'orange',S:'blue'}[l]||'blue';
}

function optsHTML(group, items, selected, idPrefix, fourCol) {
  return `<div class="opts${fourCol?' four-col':''}" role="group">
    ${items.map(({v,e,label}) => {
      const active = selected === v;
      return `<button class="opt${active?' active':''}" onclick="setP1Option('${group}','${v}')" aria-pressed="${active}">
        <span>${e}</span><span class="opt-label">${label}</span>
      </button>`;
    }).join('')}
  </div>`;
}

function responseCardHTML(c) {
  return `<div class="response-card">
    <div class="response-meta">${c.meta}</div>
    <div class="response-text">${c.story}</div>
    ${c.hint ? `<div class="followup-note">💬 ${c.hint}</div>` : ''}
  </div>`;
}

function p2OptsHTML(cat, items, lockedCorrect) {
  return `<div class="opts" role="group">
    ${items.map(({v, e, label}) => {
      const isCorrect = lockedCorrect && S.p2Attempts.some(a =>
        a.results[cat] && a.snapshot[cat]?.toLowerCase() === v.toLowerCase()
      );
      const isSelected = !isCorrect && S.p2sel[cat]?.toLowerCase() === v.toLowerCase();
      const isWrong = !isCorrect && S.p2Attempts.some((a,i) =>
        i === 0 && !a.results[cat] && a.snapshot[cat]?.toLowerCase() === v.toLowerCase()
      );
      const locked = S.p2done || lockedCorrect;
      return `<button class="opt${isCorrect?' correct':isSelected?' p2-sel':isWrong?' wrong':''}"
        onclick="${locked||isCorrect ? '' : `setP2Option('${cat}','${v}')`}"
        ${locked||isCorrect ? 'style="pointer-events:none"' : ''}>
        ${e ? `<span>${e}</span>` : ''}<span class="opt-label">${label}</span>
      </button>`;
    }).join('')}
  </div>`;
}

// ══════════════════════════════════════════════════════════
// LOCKED VIEW
// ══════════════════════════════════════════════════════════
let LOCKED_VIEW = null;

function switchView(v) {
  if (LOCKED_VIEW) return;
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn');
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('tab-'+v).className = `tab-btn tab-${v==='p1'?'1':'2'}`;
  renderAll();
}

function initView() {
  const hash = window.location.hash.replace('#','').toLowerCase();
  if (!['p1','p2'].includes(hash)) return;
  LOCKED_VIEW = hash;
  document.getElementById('view-tabs').style.display = 'none';
  const other = hash === 'p1' ? 'p2' : 'p1';
  document.getElementById('view-'+other).classList.remove('active');
  document.getElementById('view-'+hash).classList.add('active');
}

// ══════════════════════════════════════════════════════════
// RENDER ALL
// ══════════════════════════════════════════════════════════
function renderAll() {
  if (LOCKED_VIEW === 'p1') { renderP1(); return; }
  if (LOCKED_VIEW === 'p2') { renderP2(); return; }
  renderP1(); renderP2();
}

function syncAndRender() {
  renderAll();
  syncState();
}

// ══════════════════════════════════════════════════════════
// WEBSOCKET SYNC
// ══════════════════════════════════════════════════════════
let ws = null;
let wsConnected = false;

function connectWS(forceReset = false) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);

  ws.onopen = () => {
    wsConnected = true;
    updateConnectionBadge(true);
    ws.send(JSON.stringify({ type:'hello', puzzle:'p3' }));
    if (forceReset) {
      S = freshState();
      renderAll();
      syncState();
    }
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'state' && (!msg.puzzle || msg.puzzle === 'p3')) {
      applyRemoteState(msg.state);
    }
    if (msg.type === 'room' && msg.room?.p3) {
      applyRemoteState(msg.room.p3);
    }
    // Admin reset — clear puzzle state
    if (msg.type === 'room' && msg.room && msg.room.p3 === null) {
      S = freshState();
      S.showModal = false;
      S.modalData = null;
      renderAll();
      renderModal();
    }
  };

  ws.onclose = () => {
    wsConnected = false;
    updateConnectionBadge(false);
    setTimeout(() => connectWS(false), 2000);
  };

  ws.onerror = () => ws.close();
}

function syncState() {
  if (ws && wsConnected) {
    ws.send(JSON.stringify({ type:'state', puzzle:'p3', state: syncableState() }));
  }
}

function updateConnectionBadge(connected) {
  const dot = document.getElementById('conn-dot');
  const lbl = document.getElementById('conn-label');
  if (!dot||!lbl) return;
  dot.style.background = connected ? '#5bf5a8' : '#f07070';
  lbl.textContent = connected ? 'CONNECTED' : 'RECONNECTING...';
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
initView();
renderAll();

if (location.protocol !== 'file:') {
  connectWS(location.search.includes('reset'));
} else {
  updateConnectionBadge(true);
  document.getElementById('conn-label').textContent = 'LOCAL MODE';
}
</script>
