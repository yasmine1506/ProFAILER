<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEER — Room Shell</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0e1a;--surface:#111428;--border:#2a3858;
  --p1:#1a5fa8;--p1lt:#deeaf8;--p1bd:#8ab8e0;
  --p2:#6622aa;--p2lt:#ede0f8;--p2bd:#bb99e0;
  --ok:#147a50;--oklt:#d6f0e4;--okbd:#7acba8;
  --err:#b81c1c;--errlt:#fde8e8;--errbd:#e8a0a0;
  --text:#e0f0ff;--muted:#8090a8;--dim:#4a6080;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;}
.app{display:flex;flex-direction:column;height:100vh;}

/* ── Header ── */
.hdr{background:#0a0c18;border-bottom:1px solid var(--border);padding:8px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.hdr-title{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);}
.hdr-sub{font-size:11px;color:var(--dim);margin-left:4px;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#5bf5a8;animation:pulse 2s ease-in-out infinite;margin-left:auto;}
.conn-label{font-family:var(--mono);font-size:10px;color:var(--muted);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Main content ── */
.main{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;}

/* ── Role selection ── */
.role-screen{width:100%;max-width:700px;padding:24px;}
.role-title{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--text);margin-bottom:6px;letter-spacing:.04em;}
.role-sub{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.7;}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.role-card{border-radius:10px;padding:24px 20px;cursor:pointer;transition:all .2s;border:2px solid transparent;text-align:center;}
.role-card-a1{background:#0a1828;border-color:var(--p1bd);}
.role-card-a2{background:#130a28;border-color:var(--p2bd);}
.role-card:hover:not(.claimed):not(.other-claimed){transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.4);}
.role-card-a1:hover:not(.claimed):not(.other-claimed){border-color:var(--p1);}
.role-card-a2:hover:not(.claimed):not(.other-claimed){border-color:var(--p2);}
.role-card.claimed{opacity:1;cursor:default;}
.role-card.other-claimed{opacity:.3;cursor:not-allowed;pointer-events:none;}
.role-icon{font-size:42px;margin-bottom:12px;}
.role-name{font-family:var(--mono);font-size:18px;font-weight:600;margin-bottom:6px;}
.role-card-a1 .role-name{color:var(--p1lt);}
.role-card-a2 .role-name{color:var(--p2lt);}
.role-desc{font-size:13px;color:var(--muted);line-height:1.6;}
.role-claimed-badge{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11px;
  font-weight:600;padding:3px 10px;border-radius:3px;background:var(--oklt);color:var(--ok);border:1px solid var(--okbd);}
.role-waiting{font-size:13px;color:var(--muted);font-style:italic;margin-top:8px;}
.role-info{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;
  font-size:13px;color:var(--muted);line-height:1.7;text-align:center;}

/* ── Admin panel ── */
.admin-screen{width:100%;max-width:680px;padding:24px;}
.admin-title{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);margin-bottom:4px;}
.admin-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
.admin-section{margin-bottom:24px;}
.admin-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.admin-label::after{content:'';flex:1;height:1px;background:var(--border);}
.puzzle-toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.puzzle-toggle{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:14px 12px;cursor:pointer;transition:all .15s;text-align:center;}
.puzzle-toggle.on{border-color:var(--ok);background:#0a1a10;}
.puzzle-toggle-num{font-family:var(--mono);font-size:22px;font-weight:600;
  color:var(--muted);margin-bottom:4px;transition:color .15s;}
.puzzle-toggle.on .puzzle-toggle-num{color:#5bf5a8;}
.puzzle-toggle-name{font-size:12px;color:var(--dim);}
.puzzle-toggle.on .puzzle-toggle-name{color:var(--muted);}
.order-display{background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:12px 16px;font-family:var(--mono);font-size:13px;color:var(--muted);}
.order-display span{color:var(--text);}
.start-btn{width:100%;padding:14px;background:var(--ok);color:#fff;border:none;border-radius:8px;
  font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:8px;}
.start-btn:hover:not(:disabled){background:#0d6040;}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}
.reset-btn{width:100%;padding:10px;background:transparent;color:var(--err);border:1px solid var(--errbd);
  border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .2s;}
.reset-btn:hover{background:var(--errlt);}
.status-row{display:flex;gap:10px;flex-wrap:wrap;}
.status-chip{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:3px;}
.chip-pending{background:#1a1a2e;color:var(--muted);border:1px solid var(--border);}
.chip-active{background:var(--oklt);color:var(--ok);border:1px solid var(--okbd);}
.chip-done{background:#0a1a10;color:#5bf5a8;border:1px solid #2a5a30;}

/* ── Waiting / transition screens ── */
.waiting-screen{width:100%;max-width:560px;padding:24px;text-align:center;}
.waiting-title{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--text);margin-bottom:12px;}
.waiting-sub{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:24px;}
.waiting-spinner{font-size:32px;margin-bottom:16px;animation:spin 2s linear infinite;display:inline-block;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.puzzle-badge{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:600;
  padding:6px 16px;border-radius:4px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);margin-bottom:16px;}

/* ── Complete screen ── */
.complete-screen{width:100%;max-width:560px;padding:24px;text-align:center;}
.complete-icon{font-size:56px;margin-bottom:16px;}
.complete-title{font-family:var(--mono);font-size:26px;font-weight:600;color:#5bf5a8;margin-bottom:12px;}
.complete-sub{font-size:15px;color:var(--muted);line-height:1.8;}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-title">DEER — Digital Educational Escape Room <span class="hdr-sub">Room Shell v1.0</span></div>
    <div id="test-banner" style="display:none;margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700;color:#1a1200;background:#ffd166;padding:3px 10px;border-radius:4px;">🧪 TEST MODE — nothing is being saved</div>
    <div class="conn-dot" id="conn-dot"></div>
    <span class="conn-label" id="conn-label">CONNECTING...</span>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// PUZZLE METADATA
// ══════════════════════════════════════════════════════════
const PUZZLES = {
  1: { name:'Puzzle 1', url:'/puzzle1' },
  2: { name:'The Xenolinguist\'s Dilemma', url:'/' },
};

// ══════════════════════════════════════════════════════════
// ROOM STATE
// ══════════════════════════════════════════════════════════
/*
  phase:
    'idle'          — admin hasn't started yet
    'role-select'   — players choose Agent 1 / Agent 2
    'puzzle'        — puzzle is active
    'complete'      — all puzzles done

  screenId: 'admin' | 'screen2' | 'screen3'
*/

function freshRoomState() {
  return {
    phase: 'idle',
    puzzles: [],
    currentIdx: -1,
    currentPuzzle: null,
    sessionId: null,       // assigned by the server when the admin starts a session; tags every log row
    asset1Screen: null,
    asset2Screen: null,
  };
}

let R = freshRoomState();
let screenId = null;

// ══════════════════════════════════════════════════════════
// WEBSOCKET
// ══════════════════════════════════════════════════════════
let ws = null;
let wsConnected = false;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);

  ws.onopen = () => {
    wsConnected = true;
    updateBadge(true);
    // Always request current room state on (re)connect — catches up after
    // cold starts, backgrounded tabs, or network drops
    ws.send(JSON.stringify({ type:'hello', puzzle:'room', screenId }));
  };

  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    // Server answers the admin's Start Session with the new session id (used to tag all data)
    if (msg.type === 'session-id') { onSessionId(msg); return; }
    // Watch puzzle state changes for win conditions (runs on every screen)
    if (msg.type === 'state' && msg.puzzle && msg.puzzle !== 'room') {
      const slot = parseInt(msg.puzzle.replace('p',''));
      if (!isNaN(slot)) checkPuzzleWin(slot, msg.state);
    }
    if (msg.type === 'room-state') { applyRoomState(msg.state); }
    if (msg.type === 'room' && msg.room?.room) { applyRoomState(msg.room.room); }
  };

  ws.onclose = () => {
    wsConnected = false;
    updateBadge(false);
    setTimeout(() => connectWS(), 2000);
  };
  ws.onerror = () => ws.close();
}

// For player screens: poll the server for current room state every 3 seconds
// until we receive a non-idle state. This guarantees the session starts even if
// the initial hello response arrived before the session was started.
function startStatePoll() {
  if (screenId === 'admin') return;
  let attempts = 0;
  const poll = setInterval(() => {
    if (R.phase !== 'idle') { clearInterval(poll); return; }
    attempts++;
    if (ws && wsConnected) {
      ws.send(JSON.stringify({ type:'hello', puzzle:'room', screenId }));
    }
    // After 15 attempts (15s at 1s interval), slow down to every 3s
    if (attempts === 15) {
      clearInterval(poll);
      const slowPoll = setInterval(() => {
        if (R.phase !== 'idle') { clearInterval(slowPoll); return; }
        if (ws && wsConnected) {
          ws.send(JSON.stringify({ type:'hello', puzzle:'room', screenId }));
        }
      }, 3000);
    }
  }, 1000);
}

function syncRoom() {
  if (ws && wsConnected) {
    ws.send(JSON.stringify({ type:'state', puzzle:'room', state: R }));
  }
}

function applyRoomState(remote) {
  if (!remote) return; // null = no session started yet, keep idle
  R = { ...freshRoomState(), ...remote };
  render();
  if (screenId === 'admin' && R.phase === 'complete' && typeof refreshDataPanel === 'function') setTimeout(() => refreshDataPanel(true), 1500);
}

const _winListenerRegistered = {};

function checkPuzzleWin(puzzleSlot, puzzleState) {
  if (R.phase !== 'puzzle') return;
  if (R.currentPuzzle !== puzzleSlot) return;
  if (_winListenerRegistered[puzzleSlot]) return; // only register once

  let won = false;
  if (puzzleSlot === 1) won = puzzleState.phase2Complete === true;
  if (puzzleSlot === 2) won = puzzleState.p2result === 'win';

  if (!won) return;

  _winListenerRegistered[puzzleSlot] = true; // mark so we don't register again

  if (puzzleSlot === 1) {
    const handler = (e) => {
      if (e.data === 'puzzle1-complete') {
        window.removeEventListener('message', handler);
        if (R.phase === 'puzzle' && R.currentPuzzle === 1) onPuzzleComplete();
      }
    };
    window.addEventListener('message', handler);
  } else if (puzzleSlot === 2) {
    const handler = (e) => {
      if (e.data === 'puzzle2-complete') {
        window.removeEventListener('message', handler);
        if (R.phase === 'puzzle' && R.currentPuzzle === 2) onPuzzleComplete();
      }
    };
    window.addEventListener('message', handler);
  } else {
    onPuzzleComplete();
  }
}

function clearWinListeners() {
  // Clear win listener flags when session resets so they re-register on next session
  Object.keys(_winListenerRegistered).forEach(k => delete _winListenerRegistered[k]);
}

function updateBadge(ok) {
  const d = document.getElementById('conn-dot');
  const l = document.getElementById('conn-label');
  if (d) d.style.background = ok ? '#5bf5a8' : '#f07070';
  if (l) l.textContent = ok ? (screenId === 'admin' ? 'ADMIN' : `SCREEN: ${screenId}`) : 'RECONNECTING...';
}

// ══════════════════════════════════════════════════════════
// ADMIN ACTIONS (only admin screen fires these)
// ══════════════════════════════════════════════════════════
let _pendingSession = null;
function adminStartSession(puzzleOrder) {
  const fresh = freshRoomState();
  fresh.puzzles = puzzleOrder;
  fresh.phase = 'role-select';
  const begin = (id) => { R = fresh; R.sessionId = id; _pendingSession = null; syncRoom(); render(); };
  if (ws && wsConnected) {
    // the server numbers the session (S1, S2, …) and records it before anything starts
    const reqId = Math.random().toString(36).slice(2);
    _pendingSession = { reqId, begin };
    ws.send(JSON.stringify({ type: 'session-start', puzzles: puzzleOrder, reqId }));
    setTimeout(() => { if (_pendingSession && _pendingSession.reqId === reqId) begin('LOCAL-' + Date.now().toString(36)); }, 4000);
  } else {
    begin('LOCAL-' + Date.now().toString(36));
  }
}
function onSessionId(msg) {
  if (_pendingSession && _pendingSession.reqId === msg.reqId) _pendingSession.begin(msg.id);
}
// Tell the server about session milestones (server uses its own clock; duplicates from several screens are ignored)
function roomEvent(event, extra) {
  if (!R.sessionId || !ws || !wsConnected) return;
  ws.send(JSON.stringify(Object.assign({ type: 'room-event', session: R.sessionId, event }, extra || {})));
}

function adminReset() {
  selectedPuzzles.length = 0;      // otherwise the toggles look empty but still remember the last selection
  R = freshRoomState();
  clearWinListeners();
  // Clear puzzle states too so next session starts fresh
  if (ws && wsConnected) {
    ws.send(JSON.stringify({ type: 'reset-all' }));
  }
  syncRoom();
  render();
}

function adminAdvance() {
  if (R.phase === 'role-select') {
    if (!(R.asset1Screen && R.asset2Screen)) return;     // both agents must have picked a role first
    startPuzzle(0);
  } else if (R.phase === 'puzzle') {
    advanceAfterPuzzle('force');      // admin pressed Force advance during a puzzle
  }
  syncRoom();
  render();
}

function startPuzzle(idx) {
  R.currentIdx = idx;
  R.currentPuzzle = R.puzzles[idx];
  R.phase = 'puzzle';
  roomEvent('puzzle_start', { puzzle: R.currentPuzzle });
}

function advanceAfterPuzzle(how) {
  roomEvent('puzzle_end', { puzzle: R.currentPuzzle, how: how || 'complete' });
  const nextIdx = R.currentIdx + 1;
  if (nextIdx < R.puzzles.length) {
    startPuzzle(nextIdx);
  } else {
    R.phase = 'complete';
    roomEvent('session_complete');
  }
}

// Called when a puzzle reports completion (via WebSocket puzzle win detection)
function onPuzzleComplete() {
  if (R.phase !== 'puzzle') return;
  advanceAfterPuzzle('complete');
  syncRoom();
  render();
}

// ══════════════════════════════════════════════════════════
// PLAYER ACTIONS
// ══════════════════════════════════════════════════════════
function claimRole(role) {
  roomEvent('role_claim', { role });
  if (role === 'p1') {
    if (R.asset1Screen && R.asset1Screen !== screenId) return;
    R.asset1Screen = screenId;
  } else {
    if (R.asset2Screen && R.asset2Screen !== screenId) return;
    R.asset2Screen = screenId;
  }
  syncRoom();
  render();
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
function render() {
  const main = document.getElementById('main');
  if (!main) return;

  // ADMIN SCREEN
  if (screenId === 'admin') {
    renderAdmin(main);
    return;
  }

  // PLAYER SCREENS
  switch (R.phase) {
    case 'idle':
      main.innerHTML = `
        <div class="waiting-screen">
          <div class="waiting-spinner">⌛</div>
          <div class="waiting-title">Standby</div>
          <div class="waiting-sub">Waiting for the session to begin.<br>The administrator will start shortly.</div>
        </div>`;
      break;

    case 'role-select':
      renderRoleSelect(main);
      break;

    case 'puzzle':
      renderPuzzleRouting(main);
      break;

    case 'complete':
      main.innerHTML = `
        <div class="complete-screen">
          <div class="complete-icon">✅</div>
          <div class="complete-title">Missions Successfully Completed</div>
          <div class="complete-sub">All objectives achieved. Well done, agents.</div>
        </div>`;
      break;

    default:
      main.innerHTML = `<div class="waiting-screen"><div class="waiting-sub">Unknown state: ${R.phase}</div></div>`;
  }
}

function renderRoleSelect(main) {
  const myRole = R.asset1Screen === screenId ? 'p1' : R.asset2Screen === screenId ? 'p2' : null;
  const bothClaimed = R.asset1Screen && R.asset2Screen;

  if (bothClaimed && myRole) {
    main.innerHTML = `
      <div class="waiting-screen">
        <div style="font-size:48px;margin-bottom:16px;">${myRole === 'p1' ? '🕵️' : '🕵️‍♀️'}</div>
        <div class="puzzle-badge">You are Agent ${myRole === 'p1' ? '1' : '2'}</div>
        <div class="waiting-sub">Role confirmed. Briefing incoming...</div>
      </div>`;
    return;
  }

  main.innerHTML = `
    <div class="role-screen">
      <div class="role-title">Agent Identification</div>
      <div class="role-sub">Before proceeding, each agent must identify themselves.</div>
      <div class="role-cards">
        <div class="role-card role-card-a1${R.asset1Screen && R.asset1Screen !== screenId ? ' other-claimed' : R.asset1Screen === screenId ? ' claimed' : ''}"
          onclick="claimRole('p1')">
          <div class="role-icon">🕵️</div>
          <div class="role-name">Agent 1</div>
          ${R.asset1Screen === screenId ? '<div class="role-claimed-badge">✓ This is you</div>' :
            R.asset1Screen ? '<div class="role-waiting">Claimed</div>' : ''}
        </div>
        <div class="role-card role-card-a2${R.asset2Screen && R.asset2Screen !== screenId ? ' other-claimed' : R.asset2Screen === screenId ? ' claimed' : ''}"
          onclick="claimRole('p2')">
          <div class="role-icon">🕵️‍♀️</div>
          <div class="role-name">Agent 2</div>
          ${R.asset2Screen === screenId ? '<div class="role-claimed-badge">✓ This is you</div>' :
            R.asset2Screen ? '<div class="role-waiting">Claimed</div>' : ''}
        </div>
      </div>
      ${!myRole ? '<div class="role-info">Select your role above to continue.</div>' :
        !bothClaimed ? '<div class="role-info">Waiting for the other agent...</div>' : ''}
    </div>`;
}

function renderPuzzleRouting(main) {
  const puzzleNum = R.currentPuzzle;
  const puzzle = PUZZLES[puzzleNum];
  const myRole = R.asset1Screen === screenId ? 'p1' : R.asset2Screen === screenId ? 'p2' : null;

  if (!myRole) {
    main.innerHTML = `<div class="waiting-screen">
      <div class="waiting-sub">Role not assigned. Please reload and select your role.</div>
    </div>`;
    return;
  }

  const puzzleUrl = `${puzzle.url}#${myRole}`;
  // Already showing this puzzle? Leave it alone — rebuilding the iframe (e.g. after a reconnect) would restart the puzzle for the player.
  const existing = document.getElementById('puzzle-frame');
  if (existing && existing.getAttribute('src') === puzzleUrl) return;

  // Use an iframe so the player stays on room.html and keeps the WebSocket alive.
  // This means the admin's Force Advance will always reach all screens.
  main.innerHTML = `<iframe src="${puzzleUrl}"
    style="width:100%;height:100%;border:none;display:block;"
    allow="autoplay"
    id="puzzle-frame">
  </iframe>`;
}

function renderAdmin(main) {
  if (R.phase === 'idle') {    // Puzzle selection UI
    const allPuzzles = [1, 2];
    const selected = R.puzzles.length ? R.puzzles : [];

    main.innerHTML = `
      <div class="admin-screen">
        <div class="admin-title">Session Setup</div>
        <div class="admin-sub">Configure and launch the escape room session.</div>

        <div class="admin-section">
          <div class="admin-label">Select puzzles for this session</div>
          <div class="puzzle-toggles">
            ${allPuzzles.map(n => `
              <div class="puzzle-toggle${selected.includes(n) ? ' on' : ''}" id="ptog-${n}" onclick="togglePuzzle(${n})">
                <div class="puzzle-toggle-num">${n}</div>
                <div class="puzzle-toggle-name">${PUZZLES[n].name}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="admin-section">
          <div class="admin-label">Session order</div>
          <div class="order-display">
            ${selected.length ? selected.map(n=>`<span>Puzzle ${n}</span>`).join(' → ') : '<span style="color:var(--dim)">Select at least one puzzle</span>'}
          </div>
        </div>

        <div class="admin-section">
          <div class="admin-label">Data logging</div>
          ${loggingControlHtml()}
        </div>

        <button class="start-btn" onclick="confirmStart()" ${selected.length ? '' : 'disabled'}>
          ${LOGGING === false ? '🧪 Start TEST Session (not saved)' : '▶ Start Session'}
        </button>
      </div>`;
  } else {
    // Session in progress — admin always shows the control panel
    const phase = R.phase;
    const puzzleNum = R.currentPuzzle;

    {
      const bothReady = !!(R.asset1Screen && R.asset2Screen);
      const phaseLabel = { 'role-select': 'Waiting for agents', puzzle: 'Puzzle in progress', complete: 'Session complete' }[phase] || phase;
      const mainBtn = phase === 'role-select'
        ? `<button class="start-btn" onclick="adminAdvance()" ${bothReady ? '' : 'disabled'}>▶ Start Puzzle ${R.puzzles[0]}${bothReady ? '' : ' — waiting for both agents'}</button>`
        : phase === 'puzzle'
          ? `<button class="start-btn" onclick="adminAdvance()">⏭ Force advance${R.currentIdx + 1 < R.puzzles.length ? ' to Puzzle ' + R.puzzles[R.currentIdx + 1] : ' (ends the session)'}</button>`
          : '';
      main.innerHTML = `
        <div class="admin-screen">
          <div class="admin-title">${phase === 'complete' ? 'Session Complete' : 'Session Active'}</div>
          <div class="admin-sub">${R.sessionId ? 'Session <b>' + R.sessionId + '</b> — all data is tagged with this id.' : 'Monitor and control the session from here.'}</div>

          <div class="admin-section">
            <div class="admin-label">Current state</div>
            <div class="status-row">
              <span class="status-chip ${phase === 'complete' ? 'chip-done' : 'chip-active'}">${phaseLabel}</span>
              ${phase === 'puzzle' ? `<span class="status-chip chip-active">Puzzle ${R.currentPuzzle}</span>` : ''}
              <span class="status-chip ${R.asset1Screen ? 'chip-done' : 'chip-pending'}">Agent 1: ${R.asset1Screen || 'not yet'}</span>
              <span class="status-chip ${R.asset2Screen ? 'chip-done' : 'chip-pending'}">Agent 2: ${R.asset2Screen || 'not yet'}</span>
            </div>
          </div>

          <div class="admin-section">
            <div class="admin-label">Puzzle order</div>
            <div class="order-display">
              ${R.puzzles.map((n,i) => {
                const done = phase === 'complete' || i < R.currentIdx, now = phase === 'puzzle' && i === R.currentIdx;
                return `<span style="color:${now ? '#5bf5a8' : done ? 'var(--dim)' : 'var(--muted)'}">${done ? '✓ ' : ''}Puzzle ${n}</span>`;
              }).join(' → ')}
            </div>
          </div>

          ${phase === 'complete' ? `<div class="admin-section"><div style="background:#0d2b1d;border:1px solid var(--okbd);border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:13px;color:#9ff0c8;line-height:1.7;">
            ✅ Open <b>📥 Data</b> (bottom left), check it says “Backed up to gist”, download this session's data, then press Reset before the next pair.</div></div>` : ''}
          <div class="admin-section">
            <div class="admin-label">Controls</div>
            ${mainBtn}
            <button class="reset-btn" onclick="adminReset()">↺ Reset session (data is kept)</button>
          </div>
        </div>`;
    }
  }
}

const selectedPuzzles = [];
function togglePuzzle(n) {
  const idx = selectedPuzzles.indexOf(n);
  if (idx >= 0) selectedPuzzles.splice(idx, 1);
  else selectedPuzzles.push(n);
  selectedPuzzles.sort((a,b) => a-b); // keep in order
  R.puzzles = [...selectedPuzzles];
  render();
}

function confirmStart() {
  if (!R.puzzles.length) return;
  adminStartSession([...R.puzzles]);
}


// ══════════════════════════════════════════════════════════
// ADMIN DATA PANEL — download session data (CSV) from the server
// ══════════════════════════════════════════════════════════
let _dataOpen = false, _dataAutoOpened = false;

// ── Data logging on/off (test mode). null = unknown (no admin key yet / server unreachable) ──
let LOGGING = null;
function loggingControlHtml() {
  if (LOGGING === null) return `<div style="font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.6">Enter your admin key in <b>📥 Data</b> (bottom left) to control logging.</div>`;
  const on = LOGGING;
  return `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <button onclick="toggleLogging()" style="padding:10px 16px;border-radius:8px;border:1px solid ${on ? 'var(--okbd)' : '#a07a00'};background:${on ? '#0d2b1d' : '#3a2e00'};color:${on ? '#9ff0c8' : '#ffd166'};font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer">${on ? '● Logging ON — click to switch to test mode' : '🧪 Logging OFF (test mode) — click to switch back ON'}</button>
  </div>
  <div style="font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px;line-height:1.6">${on ? 'Everything players do is saved and backed up. Switch to test mode before you try things out yourself.' : 'Test sessions are not saved, numbered or backed up. Remember to switch logging back ON before real participants.'}</div>`;
}
function setLoggingState(v) {
  const next = (v === true || v === false) ? v : null;
  const changed = next !== LOGGING;
  LOGGING = next;
  const b = document.getElementById('test-banner');
  if (b) b.style.display = (screenId === 'admin' && LOGGING === false) ? 'block' : 'none';
  if (changed && screenId === 'admin' && R.phase === 'idle') render();
}
async function toggleLogging() {
  try {
    const r = await fetch('/admin/logging?enabled=' + (LOGGING ? '0' : '1'), { method: 'POST', headers: { Authorization: 'Bearer ' + adminKey() }, cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 409 ? await r.text() : r.status === 401 ? 'Wrong admin key' : 'Server error ' + r.status);
    setLoggingState((await r.json()).logging_enabled);
  } catch (e) { alert('Could not change logging: ' + e.message); }
}
function adminKey() { try { return localStorage.getItem('deer_admin_key') || ''; } catch { return ''; } }
async function adminFetch(path) {
  const r = await fetch(path, { headers: { Authorization: 'Bearer ' + adminKey() }, cache: 'no-store' });
  if (!r.ok) throw new Error(r.status === 401 ? 'Wrong admin key' : r.status === 503 ? 'ADMIN_KEY is not set on the server' : 'Server error ' + r.status);
  return r;
}
async function adminDownload(query) {
  try {
    const r = await adminFetch('/admin/export?' + query);
    const cd = r.headers.get('Content-Disposition') || '';
    const name = (/filename="([^"]+)"/.exec(cd) || [])[1] || 'deer_data.csv';
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { alert('Download failed: ' + e.message); }
}
function adminDataInit() {
  if (document.getElementById('data-btn')) return;
  const b = document.createElement('button');
  b.id = 'data-btn';
  b.style.cssText = 'position:fixed;left:14px;bottom:14px;z-index:50;background:#14182e;color:#cfe3ff;border:1px solid #3a4a78;border-radius:8px;padding:9px 14px;font-family:var(--mono);font-size:12px;cursor:pointer;';
  b.innerHTML = '📥 Data <span id="data-dot" style="display:none;color:#f07070">●</span>';
  b.onclick = toggleDataPanel;
  document.body.appendChild(b);
  const p = document.createElement('div');
  p.id = 'data-panel';
  p.style.cssText = 'display:none;position:fixed;left:14px;bottom:58px;z-index:50;width:min(640px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#0f1226;border:1px solid #3a4a78;border-radius:10px;padding:16px;font-family:var(--mono);font-size:12px;color:#cfe3ff;box-shadow:0 8px 40px rgba(0,0,0,.6);';
  document.body.appendChild(p);
  refreshDataPanel(true);
  setInterval(() => refreshDataPanel(false), 10000);
}
function toggleDataPanel() {
  _dataOpen = !_dataOpen;
  document.getElementById('data-panel').style.display = _dataOpen ? 'block' : 'none';
  if (_dataOpen) refreshDataPanel(true);
}
async function refreshDataPanel(force) {
  const p = document.getElementById('data-panel'); if (!p) return;
  if (!_dataOpen && !force) { /* still poll quietly for the warning dot */ }
  const dot = document.getElementById('data-dot');
  const keyBox = `<div style="display:flex;gap:6px;margin:8px 0 12px;"><input id="data-key" type="password" placeholder="Admin key" value="${adminKey().replace(/"/g,'')}" style="flex:1;background:#0a0c18;color:#fff;border:1px solid #3a4a78;border-radius:5px;padding:7px 9px;font-family:var(--mono);font-size:12px;"><button onclick="saveAdminKey()" style="background:#1a5fa8;color:#fff;border:none;border-radius:5px;padding:7px 12px;font-family:var(--mono);cursor:pointer;">Save key</button></div>`;
  if (!adminKey()) { setLoggingState(null); p.innerHTML = '<b>Session data</b><div style="color:#9aa8c8;margin-top:6px">Enter the admin key (the ADMIN_KEY set on Render) to download data.</div>' + keyBox; if (dot) dot.style.display = 'inline'; return; }
  try {
    const st = await (await adminFetch('/admin/status')).json();
    setLoggingState(st.logging_enabled);
    const g = st.gist;
    const gistLine = !g.configured ? '<span style="color:#f07070">⚠ Gist backup NOT configured — data is only on this server</span>'
      : g.lastError ? `<span style="color:#f07070">⚠ Gist save failing: ${esc(g.lastError)} (retrying; ${g.pending_sessions} session(s) waiting)</span>`
      : g.pending_sessions ? `<span style="color:#ffd166">⏳ Saving to gist… (${g.pending_sessions} session(s) pending)</span>`
      : `<span style="color:#5bf5a8">✓ Backed up to gist${g.lastSaved ? ' at ' + new Date(g.lastSaved).toLocaleTimeString() : ''}</span>`;
    if (dot) dot.style.display = (!g.configured || g.lastError) ? 'inline' : 'none';
    const rows = st.sessions.slice().reverse().map(s => `<tr>
      <td style="padding:5px 6px;white-space:nowrap"><b>${esc(s.id)}</b>${s.mode === 'standalone' ? ' <span style="color:#8090a8">(standalone)</span>' : ''}</td>
      <td style="padding:5px 6px;color:#9aa8c8">${s.start ? new Date(s.start).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : ''}</td>
      <td style="padding:5px 6px;text-align:right">${s.rows_p1}/${s.rows_p2}</td>
      <td style="padding:5px 6px;text-align:center">${s.all_completed ? '✅' : (s.ended_by === 'complete' ? '⏭' : (s.ended_by === 'reset' ? '↺' : '…'))}</td>
      <td style="padding:5px 6px;white-space:nowrap"><button class="dl" onclick="adminDownload('type=events&session=${encodeURIComponent(s.id)}')">events</button> <button class="dl" onclick="adminDownload('type=summary&session=${encodeURIComponent(s.id)}')">summary</button></td></tr>`).join('');
    p.innerHTML = `<style>#data-panel .dl{background:#1a2a4a;color:#cfe3ff;border:1px solid #3a4a78;border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:11px;cursor:pointer}#data-panel .dl:hover{background:#25407a}</style>
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Session data</b><button class="dl" onclick="toggleDataPanel()">close</button></div>
      <div style="margin:8px 0 12px">${st.logging_enabled === false ? '<span style="color:#ffd166">🧪 Test mode — new sessions are NOT being saved</span><br>' : ''}${gistLine}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <button class="dl" onclick="adminDownload('type=events&session=all')">All sessions — events (both puzzles)</button>
        <button class="dl" onclick="adminDownload('type=summary&session=all')">All sessions — summary</button>
        <button class="dl" onclick="saveNow()">Save to gist now</button>
      </div>
      <table style="width:100%;border-collapse:collapse"><thead><tr style="color:#8090a8;text-align:left"><th style="padding:4px 6px">Session</th><th style="padding:4px 6px">Started</th><th style="padding:4px 6px;text-align:right">Rows P1/P2</th><th style="padding:4px 6px" title="✅ both puzzles completed · ⏭ ended with force-advance · ↺ reset · … in progress / unknown">Done</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="5" style="padding:8px 6px;color:#8090a8">No sessions recorded yet.</td></tr>'}</tbody></table>
      <details style="margin-top:12px"><summary style="cursor:pointer;color:#8090a8">Admin key</summary>${keyBox}</details>`;
    if (R.phase === 'complete' && !_dataAutoOpened) { _dataAutoOpened = true; if (!_dataOpen) toggleDataPanel(); }
  } catch (e) {
    if (dot) dot.style.display = 'inline';
    setLoggingState(null);
    p.innerHTML = `<b>Session data</b><div style="color:#f07070;margin-top:6px">${esc(e.message)}</div>` + keyBox;
  }
}
function saveAdminKey() {
  const v = document.getElementById('data-key').value.trim();
  try { localStorage.setItem('deer_admin_key', v); } catch (e) {}
  refreshDataPanel(true);
}
async function saveNow() { try { await adminFetch('/admin/save-now'); } catch (e) { alert(e.message); } refreshDataPanel(true); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
function initView() {
  const hash = window.location.hash.replace('#','').toLowerCase();
  if (hash === 'admin') {
    screenId = 'admin';
  } else if (hash === 'screen2') {
    screenId = 'screen2';
  } else if (hash === 'screen3') {
    screenId = 'screen3';
  } else {
    // No hash — show a selector
    document.getElementById('main').innerHTML = `
      <div class="waiting-screen">
        <div class="waiting-title">Select your screen</div>
        <div class="waiting-sub" style="margin-bottom:20px;">Open this URL with the correct hash:</div>
        <div style="font-family:var(--mono);font-size:13px;color:var(--muted);line-height:2.2;">
          <div><a href="#admin" style="color:#5bf5a8;" onclick="location.reload()">#admin</a> — Session control (facilitator)</div>
          <div><a href="#screen2" style="color:var(--p1lt);" onclick="location.reload()">#screen2</a> — Player screen 1</div>
          <div><a href="#screen3" style="color:var(--p2lt);" onclick="location.reload()">#screen3</a> — Player screen 2</div>
        </div>
      </div>`;
    return false;
  }
  return true;
}

const ready = initView();
if (ready) {
  if (screenId === 'admin') adminDataInit();
  render();
  if (location.protocol !== 'file:') {
    connectWS();
    startStatePoll();
  } else {
    updateBadge(true);
    document.getElementById('conn-label').textContent = 'LOCAL MODE';
  }
}
</script>
</body>
